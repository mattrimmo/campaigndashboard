name: Daily revenue sync

on:
  schedule:
    - cron: "10 6 * * *"   # 06:10 UTC every day
  workflow_dispatch: {}

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Sync
        env:
          SONGSTATS_API_KEY: ${{ secrets.SONGSTATS_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scripts/sync.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "campaign-revenue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Revenue sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
